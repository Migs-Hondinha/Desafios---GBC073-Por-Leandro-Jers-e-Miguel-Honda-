[project]
name = "sumo-neuronio"
version = "0.1.0"
description = "Sumô × Neurônio: o MLP do grupo prevê o próximo golpe do jogador."
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.9", "pygame>=2.6", "numpy>=2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
